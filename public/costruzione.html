<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Costruzione | Cesare Dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #4b5563;
      --text-h: #111827;
      --accent: #aa3bff;
      --border: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f11;
        --text: #9ca3af;
        --text-h: #f3f4f6;
        --accent: #c084fc;
        --border: #1f2023;
      }
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      max-width: 400px;
      width: 85%;
      text-align: left;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent);
      display: inline-block;
      box-shadow: 0 0 8px var(--accent);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--text-h);
      margin: 0 0 16px 0;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0 0 32px 0;
      font-weight: 300;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-h);
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      gap: 8px;
      transition: opacity 0.2s ease;
      outline: none;
    }

    .btn-back:hover {
      opacity: 0.7;
    }

    .btn-back svg {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .btn-back:hover svg {
      transform: translateX(-4px);
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="badge">
      <span class="dot"></span>
      In costruzione
    </div>
    <h1>Pagina in costruzione</h1>
    <p>Questa risorsa non è ancora disponibile. La lezione e la spiegazione dettagliata del progetto verranno pubblicate a breve.</p>
    <button class="btn-back" onclick="window.close()">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      Chiudi finestra
    </button>
  </div>
</body>
</html>
